name: Release Signed Android APK

on:
  workflow_dispatch:
    inputs:
      notes_ar:
        description: Arabic release notes
        required: false
        default: تحسينات الأمان والأداء
      notes_en:
        description: English release notes
        required: false
        default: Security and performance improvements
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ALHAYAA_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ALHAYAA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALHAYAA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALHAYAA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ALHAYAA_RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/biology7-release.jks"

      - name: Build web app
        run: npm run build
        env:
          VITE_SERVER_URL: https://biology7.vercel.app

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        env:
          ALHAYAA_KEYSTORE_PATH: ${{ runner.temp }}/biology7-release.jks
          ALHAYAA_KEYSTORE_PASSWORD: ${{ secrets.ALHAYAA_KEYSTORE_PASSWORD }}
          ALHAYAA_KEY_ALIAS: ${{ secrets.ALHAYAA_KEY_ALIAS }}
          ALHAYAA_KEY_PASSWORD: ${{ secrets.ALHAYAA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify signature and prepare release metadata
        id: metadata
        shell: bash
        env:
          NOTES_AR: ${{ inputs.notes_ar || 'تحسينات الأمان والأداء' }}
          NOTES_EN: ${{ inputs.notes_en || 'Security and performance improvements' }}
        run: |
          VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' android/app/build.gradle | head -1)
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' android/app/build.gradle | head -1)
          TAG="android-v${VERSION_NAME}"
          APK_NAME="biology7-v${VERSION_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          apksigner verify --verbose --print-certs "$APK_NAME"
          SHA256=$(sha256sum "$APK_NAME" | awk '{print $1}')
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$APK_URL" \
            --arg sha256 "$SHA256" \
            --arg notesAr "$NOTES_AR" \
            --arg notesEn "$NOTES_EN" \
            '{versionCode:$versionCode,versionName:$versionName,apkUrl:$apkUrl,sha256:$sha256,mandatory:false,notesAr:$notesAr,notesEn:$notesEn}' \
            > update.json
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.metadata.outputs.tag }}" \
            "${{ steps.metadata.outputs.apk_name }}" update.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Biology 7 Android v${{ steps.metadata.outputs.version_name }}" \
            --notes "Signed Android release with SHA-256 verified in-app updates."
